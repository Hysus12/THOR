<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>捲簾將軍 · Google</title>
<style>
:root{--bg:#f8f9fb;--surf:#fff;--cont:#f0f4f9;--cont2:#e6ebf2;--on:#1f1f1f;--on2:#5f6368;--out:#c4c7c5;--pri:#0b57d0;--onpri:#fff;--pc:#d3e3fd;--onpc:#041e49;--tc:#c4eed0;--ontc:#072711;--err:#b3261e;--ec:#f9dedc;
--s-wall:#e8eef7;--s-sky:#cfe3fb;--s-sun:#fcd34d;--s-hill:#9fd6b0;--s-frame:#fff;--s-drape:#7da6e6;--s-rod:#5f6368;--s-weight:#1f1f1f;--s-line:#5f6368}
@media (prefers-color-scheme:dark){:root{--bg:#131314;--surf:#1e1f20;--cont:#282a2c;--cont2:#333537;--on:#e3e3e3;--on2:#c4c7c5;--out:#444746;--pri:#a8c7fa;--onpri:#062e6f;--pc:#0842a0;--onpc:#d3e3fd;--tc:#0f5223;--ontc:#c4eed0;--err:#f2b8b5;--ec:#601410;
--s-wall:#25272b;--s-sky:#1d3a63;--s-sun:#fcd34d;--s-hill:#2f6b46;--s-frame:#dadce0;--s-drape:#5b87d1;--s-rod:#bdc1c6;--s-weight:#e8eaed;--s-line:#bdc1c6}}
:root{--rc-bg:var(--cont2);--rc-fg:var(--on);--rc-acc:var(--pri);--rc-onacc:var(--onpri);--rc-muted:var(--on2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--on);font:15px/1.45 "Google Sans","Product Sans",Roboto,"Noto Sans TC","PingFang TC",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}button,input,select{font:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:760px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 4px 8px}
.bar small{display:block;color:var(--on2);font-size:13px}.bar h1{margin:2px 0 0;font-size:30px;font-weight:400;letter-spacing:-.2px}
.chip-s{display:inline-flex;align-items:center;gap:7px;background:var(--cont);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--on2)}
.chip-s i{width:8px;height:8px;border-radius:50%;background:var(--err)}[data-online="1"] .chip-s i{background:#1e8e3e}
.grid{display:grid;gap:12px;margin-top:10px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--cont);border-radius:28px;padding:20px;position:relative;overflow:hidden}
.card.pc{background:var(--pc);color:var(--onpc)}.card.tc{background:var(--tc);color:var(--ontc)}.card.surf{background:var(--surf);box-shadow:0 0 0 1px var(--out) inset}
.card h2{margin:0 0 6px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;opacity:.85}
.big-time{font-size:76px;line-height:1;font-weight:400;letter-spacing:-3px;margin:16px 0 6px}.when{font-size:18px}.sub{font-size:13px;opacity:.75}
.state{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--ontc) 12%,transparent);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500}
.btn{appearance:none;border:0;border-radius:99px;background:var(--cont2);color:var(--on);padding:10px 22px;font-weight:500;cursor:pointer;transition:box-shadow .2s,background .2s,transform .1s}
.btn:hover{box-shadow:0 1px 3px rgba(0,0,0,.25)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.38;pointer-events:none}
.btn.primary{background:var(--pri);color:var(--onpri)}.btn.danger{background:var(--err);color:#fff}.btn.sm{padding:6px 14px;font-size:13px;background:transparent;color:var(--pri)}
.btn.big{height:56px;border-radius:18px;font-size:16px;padding:0 24px}
.btn.armed{background:var(--err);color:#fff;animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--err) 22%,transparent)}}
.rel{display:flex;gap:10px;margin-top:8px}.rel .big{flex:1}.rel.two{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}.btn.hold.down{background:var(--pri);color:var(--onpri)}
.angle{font-size:60px;font-weight:400;line-height:1;text-align:center}.angle small{font-size:22px;color:var(--on2)}
input[type=range]{width:100%;accent-color:var(--pri);margin:12px 0}
.seg{display:flex;border:1px solid var(--out);border-radius:99px;overflow:hidden}.seg .btn{flex:1;border-radius:0;background:transparent;padding:9px 8px;font-size:13px;border-right:1px solid var(--out)}.seg .btn:last-child{border:0}.seg .btn.on{background:var(--pc);color:var(--onpc)}
.field{margin:14px 0 0}.field>label{display:block;font-size:12px;color:var(--on2);margin:0 0 4px 14px}
input[type=number],input[type=time],input[type=text],input:not([type]),select{width:100%;border:1px solid var(--out);background:transparent;border-radius:14px;padding:13px 16px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}.fields.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;justify-content:space-between}.chip{flex:1;max-width:46px;aspect-ratio:1;border:1px solid var(--out);border-radius:12px;background:transparent;cursor:pointer;font-weight:500}.chip.on{background:var(--pc);color:var(--onpc);border-color:transparent}
.note{font-size:12px;color:var(--on2);margin:12px 4px 0}.empty{padding:26px 8px;text-align:center;color:var(--on2)}
.list{list-style:none;margin:0;padding:0}.item{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--out)}.item:last-child{border:0}
.item .t{font-size:36px;font-weight:400;letter-spacing:-1px;min-width:100px}.item .body{flex:1}.item .d{font-weight:500}.item .m{font-size:13px;color:var(--on2)}.item .x{color:var(--err)}
.log{list-style:none;margin:0;padding:0}.log li{display:flex;gap:16px;padding:12px 4px;border-bottom:1px solid var(--out)}.log li:last-child{border:0}.log time{color:var(--on2);font-variant-numeric:tabular-nums;min-width:64px}
.kv{margin:0}.kv>div{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--out)}.kv>div:last-child{border:0}.kv dt{color:var(--on2)}.kv dd{margin:0}
.fab{position:fixed;right:max(20px,calc(50% - 360px));bottom:calc(98px + env(safe-area-inset-bottom));z-index:7;height:56px;border-radius:18px;padding:0 22px 0 18px;display:flex;align-items:center;gap:10px;background:var(--pc);color:var(--onpc);border:0;font-weight:500;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cont);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:520px}.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--on2);cursor:pointer}
.nav button span.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:.2s}.nav button.active{color:var(--on)}.nav button.active .pill{background:var(--pc);color:var(--onpc)}
dialog.sheet{border:0;padding:24px;width:min(520px,calc(100% - 24px));max-height:92vh;background:var(--surf);color:var(--on);border-radius:28px;overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}.sheet h3{margin:0 0 4px;font-size:24px;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#303030;color:#f2f2f2;padding:13px 20px;border-radius:12px;font-size:14px;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--err);color:#fff}
@media(min-width:900px){
 body{padding:0 0 0 96px}.nav{top:0;right:auto;width:96px;bottom:0;padding:24px 0;background:transparent;justify-content:flex-start;align-items:flex-start}.nav .in{flex-direction:column;gap:18px;max-width:none}
 .fab{bottom:32px}.toast{bottom:32px}}
:root{--sc-wall1:#eaf0f8;--sc-wall2:#d3deed;--sc-frame1:#ffffff;--sc-frame2:#cdd7e6;--sc-sky1:#79aeee;--sc-sky2:#dcebff;--sc-sun:#fff6cf;--sc-hill1:#bfe0c9;--sc-hill2:#8fc7a3;--sc-hill3:#5da57e;--sc-drape:#7ea6e0;--sc-drape-hi:#b5cff3;--sc-drape-lo:#4a76ba;--sc-floor1:#cdb594;--sc-floor2:#a58d69;--sc-metal:#6f7c8f;--sc-cord:#2b3445;--sc-tint:#9ec4ff}
@media (prefers-color-scheme:dark){:root{--sc-drape:#5a82c2;--sc-drape-hi:#7ea3dc;--sc-drape-lo:#33558a;--sc-wall1:#403d39;--sc-wall2:#2b2927;--sc-frame1:#dcd7cd;--sc-frame2:#8f897e;--sc-sky1:#223f68;--sc-sky2:#7e98b8;--sc-sun:#ffd98a;--sc-hill1:#6b8b86;--sc-hill2:#4b7a6a;--sc-hill3:#2f5a47;--sc-floor1:#8a6a47;--sc-floor2:#5e4630;--sc-beam:#ffe3a8;--sc-drape:#a98862;--sc-drape-hi:#c7a67e;--sc-drape-lo:#6e5538;--sc-tint:#ffb85a}}
.scene-wrap{border-radius:18px;overflow:hidden;margin:6px 0 12px;aspect-ratio:4/3}
</style>
</head>
<body>
<div id="app" data-phase-root data-phase="offline" data-online="0">
<div class="app">
 <header class="bar"><div><small>我的裝置</small><h1 data-bind="name">重槌日安</h1></div><span class="chip-s"><i></i><span data-bind="conn"></span></span></header>

 <section data-tab="home">
  <div class="grid two">
   <div class="card pc"><h2><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>下一次</h2>
    <div class="big-time" data-bind="nextTime">--:--</div><div class="when" data-bind="nextWhen"></div><div class="sub" data-bind="nextDesc"></div><div class="sub" data-bind="nextLeft"></div><div class="sun"></div></div>
   <div class="card tc"><h2>窗簾<span class="state" style="margin-left:auto" data-bind="phaseLabel"></span></h2>
    <!--SCENE--><div data-c="release"></div></div>
  </div>
  <div class="grid"><details class="card surf manual-disclosure"><summary><span>手動定位</span><span class="manual-hint">點開調整</span></summary><div class="manual-body" data-c="manual"></div></details></div>
 </section>
 <section data-tab="schedule" hidden>
  <div class="grid"><div class="card surf"><h2>週間排程 · <span data-bind="count"></span></h2><div data-c="schedules"></div></div></div>
 </section>
 <section data-tab="tools" hidden>
  <div class="grid two"><div class="card surf"><h2>裝置設定</h2><div data-c="cfg"></div></div><div class="card surf"><h2>連續旋轉</h2><div data-c="advanced"></div></div></div>
 </section>
 <section data-tab="activity" hidden>
  <div class="grid two"><div class="card surf"><h2>活動</h2><div data-c="activity"></div></div><div class="card surf"><h2>裝置狀態</h2><div data-c="system"></div></div></div>
 </section>
</div>
<button class="fab" id="addBtn" data-online-only hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增排程</button>
<nav class="nav"><div class="in">
 <button data-tab-btn="home"><span class="pill"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M4 12h16"/></svg></span>控制</button>
 <button data-tab-btn="schedule"><span class="pill"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>排程</button>
 <button data-tab-btn="tools"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>進階</button>
 <button data-tab-btn="activity"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>活動</button>
</div></nav>
<dialog class="sheet" id="sheet"><h3>新增排程</h3><div data-c="scheduleForm"></div></dialog>
<div data-c="toast"></div>
</div>
<!--CORE-->
<script>
ESP.mount(); ESP.tabs(document.getElementById('app'),function(n){document.getElementById('addBtn').hidden=n!=='schedule'});
var open=ESP.sheet(document.getElementById('sheet')); document.getElementById('addBtn').onclick=open;
</script>
</body>
</html>
