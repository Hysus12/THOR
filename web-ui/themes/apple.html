<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>捲簾將軍 · Apple</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--label:#000;--label2:#6c6c70;--sep:rgba(60,60,67,.18);
--blue:#007aff;--red:#ff3b30;--green:#34c759;--orange:#ff9500;--glass:rgba(249,249,249,.78);
--s-wall:#ecebe6;--s-sky:#cfe5f7;--s-sun:#ffd666;--s-hill:#a9d1b4;--s-frame:#fbfbfa;--s-drape:#e2c7a3;--s-rod:#8e8e93;--s-weight:#3a3a3c;--s-line:#8e8e93}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--label:#fff;--label2:#98989f;--sep:rgba(84,84,88,.6);
--blue:#0a84ff;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--glass:rgba(29,29,31,.78);
--s-wall:#2c2c2e;--s-sky:#1e3350;--s-sun:#f5d36b;--s-hill:#2d5a3f;--s-frame:#d1d1d6;--s-drape:#8a6b4a;--s-rod:#aeaeb2;--s-weight:#e5e5ea;--s-line:#aeaeb2}}
:root{--rc-bg:var(--fill);--rc-fg:var(--label);--rc-acc:var(--blue);--rc-onacc:#fff;--rc-muted:var(--label2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top)}
.nav-in{max-width:680px;margin:0 auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--label2)}
.conn{display:flex;align-items:center;gap:7px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
[data-online="1"] .dot{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
main{max-width:680px;margin:0 auto;padding:0 16px}
h1.large{font-size:34px;line-height:1.12;letter-spacing:.2px;font-weight:700;margin:14px 4px 2px}
.sub{margin:0 4px 16px;color:var(--label2);font-size:15px}
h2.group{font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--label2);font-weight:400;margin:26px 16px 8px}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin:0 0 12px}
.pad{padding:18px}
.hero{aspect-ratio:4/3;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--s-sky) 55%,var(--card)),var(--card))}
.state{position:absolute;left:14px;top:14px}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--glass);backdrop-filter:blur(12px);font-size:13px;font-weight:600}
[data-phase="released"] .pill{color:var(--orange)}[data-phase="locked"] .pill{color:var(--green)}[data-phase="offline"] .pill{color:var(--red)}
.btn{appearance:none;border:0;border-radius:12px;background:var(--fill);color:var(--blue);padding:11px 16px;font-weight:500;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97);background:var(--fill2)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.sm{padding:7px 12px;font-size:14px;border-radius:99px}
.btn.big{height:56px;border-radius:16px;font-size:18px;font-weight:600}
.btn.armed{background:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}}
.rel{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:14px}.rel.two{grid-template-columns:1fr 1fr;padding:12px 0 0}
.btn.hold.down{background:var(--blue);color:#fff}
.next{padding:18px 20px}.next .k{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}
.next .time{font-size:64px;font-weight:200;letter-spacing:-2px;line-height:1.05;margin:2px 0}.next .when{font-weight:600;font-size:20px;margin-left:8px;letter-spacing:0}
.next .d{color:var(--label2);font-size:15px}
.angle{text-align:center;font-size:56px;font-weight:200;line-height:1}.angle small{font-size:22px;color:var(--label2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:10px 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--fill2)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}.seg .btn{flex:1;background:transparent;color:var(--label);border-radius:8px;padding:8px 6px;font-size:14px}
.seg .btn.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.field{margin:14px 0 0}.field>label{display:block;font-size:13px;color:var(--label2);margin:0 0 6px 4px}
input[type=number],input[type=time],input:not([type]),input[type=text],select{width:100%;border:0;background:var(--fill);border-radius:11px;padding:12px 14px;outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--blue)}
.fields.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;justify-content:space-between;gap:6px}.chip{flex:1;aspect-ratio:1;max-width:46px;border:0;border-radius:50%;background:var(--fill);font-weight:600;cursor:pointer}.chip.on{background:var(--blue);color:#fff}
.note{font-size:13px;color:var(--label2);margin:12px 4px 0}.empty{padding:28px 20px;text-align:center;color:var(--label2)}
.list{list-style:none;margin:0;padding:0}.item{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 20px;position:relative}
.item+.item:before{content:"";position:absolute;left:20px;right:0;top:0;border-top:.5px solid var(--sep)}
.item .t{font-size:34px;font-weight:300;letter-spacing:-1px;min-width:98px}.item .body{flex:1;min-width:0}.item .d{font-weight:600}.item .m{font-size:14px;color:var(--label2)}
.item .x{background:transparent;color:var(--red)}
.log{list-style:none;margin:0;padding:0}.log li{display:flex;gap:14px;padding:12px 20px;position:relative;font-size:15px}.log li+li:before{content:"";position:absolute;left:20px;right:0;top:0;border-top:.5px solid var(--sep)}.log time{color:var(--label2);font-variant-numeric:tabular-nums;min-width:62px}
.kv{margin:0}.kv>div{display:flex;justify-content:space-between;padding:12px 20px;position:relative}.kv>div+div:before{content:"";position:absolute;left:20px;right:0;top:0;border-top:.5px solid var(--sep)}.kv dt{color:var(--label2)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.add{display:block;width:100%;margin:0 0 12px;text-align:left;padding:15px 20px;border-radius:20px;background:var(--card);color:var(--blue);font-weight:500}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabbar .in{display:flex;width:100%;max-width:680px}.tabbar button{flex:1;border:0;background:none;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;padding:4px 0;cursor:pointer}
.tabbar button.active{color:var(--blue)}
dialog.sheet{border:0;padding:8px 20px 28px;width:min(560px,100%);max-height:92vh;background:var(--bg);color:var(--label);border-radius:26px 26px 0 0;margin:auto auto 0;overflow:auto}
@media(min-width:700px){dialog.sheet{margin:auto;border-radius:26px}}
dialog.sheet::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(3px)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:2px auto 12px}.sheet h3{margin:0 0 4px;font-size:22px;text-align:center}
.toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--glass);backdrop-filter:blur(20px);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{color:var(--red)}
@media (prefers-color-scheme:dark){:root{--sc-wall1:#403d39;--sc-wall2:#2b2927;--sc-frame1:#dcd7cd;--sc-frame2:#8f897e;--sc-sky1:#223f68;--sc-sky2:#7e98b8;--sc-sun:#ffd98a;--sc-hill1:#6b8b86;--sc-hill2:#4b7a6a;--sc-hill3:#2f5a47;--sc-floor1:#8a6a47;--sc-floor2:#5e4630;--sc-beam:#ffe3a8;--sc-drape:#a98862;--sc-drape-hi:#c7a67e;--sc-drape-lo:#6e5538;--sc-tint:#ffb85a}}
.hero .scene-wrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
</style>
</head>
<body>
<div id="app" data-phase-root data-phase="offline" data-online="0">
<header class="nav"><div class="nav-in"><span class="conn"><i class="dot"></i><span data-bind="conn"></span></span><span>Wi-Fi · <span data-bind="rssi"></span></span></div></header>
<main>
 <section data-tab="home">
  <h1 class="large" data-bind="name">重槌日安</h1>
  <p class="sub"><span data-bind="phaseLabel"></span> · 裝置時間 <span data-bind="localTime"></span></p>
  <div class="card hero"><!--SCENE--><div class="state"><span class="pill" data-bind="phaseLabel"></span></div></div>
  <div class="card" data-c="release"></div>
  <div class="card next"><div class="k">下一次</div><div><span class="time" data-bind="nextTime">--:--</span><span class="when" data-bind="nextWhen"></span></div><div class="d" data-bind="nextDesc"></div><div class="d" data-bind="nextLeft"></div></div>
  <details class="card manual-disclosure"><summary><span>手動定位</span><span class="manual-hint">點開調整</span></summary><div class="manual-body" data-c="manual"></div></details>
 </section>
 <section data-tab="schedule" hidden>
  <h1 class="large">排程</h1><p class="sub">每週自動釋放，儲存在 ESP8266（最多 8 筆）。<span data-bind="count"></span></p>
  <button class="add btn" id="addBtn" data-online-only>＋ 新增排程</button>
  <div class="card" data-c="schedules"></div>
 </section>
 <section data-tab="tools" hidden>
  <h1 class="large">進階</h1><p class="sub">裝置與介面設定。</p>
  <h2 class="group">裝置設定</h2><div class="card pad" data-c="cfg"></div>
  <h2 class="group">連續旋轉</h2><div class="card pad" data-c="advanced"></div>
 </section>
 <section data-tab="activity" hidden>
  <h1 class="large">活動</h1><p class="sub">這個瀏覽器送出的指令。</p>
  <div class="card" data-c="activity"></div>
  <h2 class="group">裝置狀態</h2><div class="card" data-c="system"></div>
 </section>
</main>
<nav class="tabbar"><div class="in">
 <button data-tab-btn="home"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M4 12h16"/></svg>控制</button>
 <button data-tab-btn="schedule"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>排程</button>
 <button data-tab-btn="tools"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>進階</button>
 <button data-tab-btn="activity"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>活動</button>
</div></nav>
<dialog class="sheet" id="sheet"><div class="grab"></div><h3>新增排程</h3><div data-c="scheduleForm"></div></dialog>
<div data-c="toast"></div>
</div>
<!--CORE-->
<script>
ESP.mount(); ESP.tabs(document.getElementById('app'));
var open=ESP.sheet(document.getElementById('sheet')); document.getElementById('addBtn').onclick=open;
</script>
</body>
</html>
